  methods:
    - method: "agent"
      models: ["Claude Opus (Anthropic)"]
      framework: "Claude agent seats (Claude.ai with code execution and the Claude Agent SDK), run under the author's team process"
      tool_setup: >-
        AI-generated: every Lean file was written by Claude Opus agent seats from the paper's
        statements and proofs, compiled with lake against the pinned Mathlib, and checked by a
        separate seat that did not write the code: a fresh rebuild, a module-wide axiom
        collector (only propext, Classical.choice and Quot.sound), non-vacuity instances and
        planted errors that must fail. The port to Lean and Mathlib v4.35.0-rc2 and the
        module system was done by one seat and verified by another. Challenge.lean,
        Frobenius/Statements.lean and Solution.lean were written by Claude Opus 5.5.
      cost:
        wall_time: "agent runs over several weeks, October and November 2026"
        spend_usd: "not tracked"
        hardware: "API-only plus a cloud workspace"
      prompting_notes: >-
        Each seat received a written brief: the statements to formalize with their paper
        proofs, the forbidden constructs (sorry, native_decide, new axioms), and the checks
        its verifier would run.
  spend_usd: "not tracked"
  notes: >-
    The results, proofs, paper and Lean code were produced by Claude Opus agent seats under the
    author's direction; the author chose the problems, ran the process and takes
    responsibility for errors. Each paper proof was read by an independent cold reader with its
    own exact computations, and each Lean file was verified by a seat that did not write it.

fidelity:
  divergences: >-
    A level identity 1/f = sum f^z sigma(g_z) (mod p^k) is written without the inverse, as
    p^k dividing 1 - f * sum f^z sigma(g_z); levelCount is 0 when no identity exists, so the
    upper bounds are also stated through HasLevel (dirichlet_identity, and IsLeast in
    flag_formula_int and flag_formula_padic). In Theorem 4.4 the
    identity is required at every n, with integer valued g_z, and the congruence is
    coefficientwise. The Kempner value is defined as an infimum, sInf {N | p^k divides N!}.
    Theorem 6.1's hypothesis f(1) a unit is used as stated; Corollary 7.8 is over Z and Z_p
    (no multiplicativity, n primes with p not dividing f(q) and p^n >= S(p^k)). In Theorem 7.4
    the variables are indexed by Fin n and the lift is Mathlib's MvPowerSeries.expand p. In
    Theorem 7.7 the rank r_f is a cardinal and p^infinity = infinity is encoded by the first
    disjunct of dFlagValue. The Kempner value at k = 0 is 0 in Lean (the usual S(1) is 1); every
    statement assumes k >= 1 except kkm_degrees, kkm_conjecture4 and kkm_greatest_modulus, where
    gamma = 0 is allowed and 0 is the correct least degree.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (Anthropic) agent seats that did not write the material they checked: cold readers of every paper proof; seat PV (the Lean port); seat PC (this statement file); seats CC and CF (the preprint against the Lean)"
  notes: >-
    Each Lean file was verified by a seat that did not write it (fresh rebuild, module-wide
    axiom collector, non-vacuity instances, planted errors). Seat PC compared each statement in
    Challenge.lean with the result of the preprint it names, checked the byte identity of the
    definitions with Frobenius/Statements.lean, and confirmed that planted mismatches are
    rejected; seats CC and CF printed the type of every Lean name cited in the preprint and
    compared it with the printed statement. The definitions in Challenge.lean are not Comparator
    holes: definition_names is empty, so Comparator checks every definition the statements use,
    body included, and Solution.lean links those definitions to the development by short bridge
    lemmas. No human referee has reviewed the preprint or the formalization; the author is
    responsible for both.
alignment:
  namespace: "Frobenius"
  statements:
    - source: "Theorem 4.4"
      lean: "Frobenius.mobius_levels"
      module: "Challenge"
      status: "proved"
      note: "Both bounds: an identity with levels z <= S(p^k) - 1, and S(p^k) <= L + 1 for every identity of level L. Proved by FrobCong.levels_sharp_kempner."
    - source: "Theorem 5.1, the set of degrees"
      lean: "Frobenius.kkm_degrees"
      module: "Challenge"
      status: "proved"
      note: "The t-degrees of monic A in Z[z][t] with A(z, Phi_p) = 0 (mod p^gamma) are exactly the d with p^gamma | d!."
    - source: "Theorem 5.1 (Conjecture 4 of Kauers, Krattenthaler and Müller)"
      lean: "Frobenius.kkm_conjecture4"
      module: "Challenge"
      status: "proved"
      note: "The least such degree is S(p^gamma), for every prime p and every gamma >= 0."
    - source: "Theorem 5.1, best modulus"
      lean: "Frobenius.kkm_greatest_modulus"
      module: "Challenge"
      status: "proved"
      note: "For each d the largest gamma is v_p(d!)."
    - source: "Theorem 6.1, the identity"
      lean: "Frobenius.dirichlet_identity"
      module: "Challenge"
      status: "proved"
      note: "Over every commutative ring."
    - source: "Theorem 6.1"
      lean: "Frobenius.dirichlet_upper"
      module: "Challenge"
      status: "proved"
      note: "L_f(p,k) + 1 <= S(p^k) over every commutative ring."
    - source: "Corollary 7.8 over Z, lower bound"
      lean: "Frobenius.dirichlet_lower_int"
      module: "Challenge"
      status: "proved"
      note: "No multiplicativity; n primes with p not dividing f(q)."
    - source: "Corollary 7.8 over Z, exact value"
      lean: "Frobenius.dirichlet_exact_int"
      module: "Challenge"
      status: "proved"
      note: "With S(p^k) <= p^n."
    - source: "Corollary 7.8 over Z_p, lower bound"
      lean: "Frobenius.dirichlet_lower_padic"
      module: "Challenge"
      status: "proved"
      note: "As over Z."
    - source: "Corollary 7.8 over Z_p, exact value"
      lean: "Frobenius.dirichlet_exact_padic"
      module: "Challenge"
      status: "proved"
      note: "As over Z."
    - source: "Theorem 7.4 over Z"
      lean: "Frobenius.flag_formula_int"
      module: "Challenge"
      status: "proved"
      note: "Every unit of Z[[x_1..x_n]] with the lift x_i -> x_i^p, every prime, every k >= 1; stated with IsLeast: an identity of level flagValue - 1 exists and none of lower level."
    - source: "Theorem 7.4 over Z_p"
      lean: "Frobenius.flag_formula_padic"
      module: "Challenge"
      status: "proved"
      note: "Every unit of Z_p[[x_1..x_n]]."
    - source: "Theorem 7.7 over Z"
      lean: "Frobenius.dirichlet_flag_formula_int"
      module: "Challenge"
      status: "proved"
      note: "Every f with f(1) a unit, flag of finite or infinite length; the Lean proof restricts to finitely many primes and uses compactness, not the tower sketched in the paper."
    - source: "Theorem 7.7 over Z_p"
      lean: "Frobenius.dirichlet_flag_formula_padic"
      module: "Challenge"
      status: "proved"
      note: "As over Z."

