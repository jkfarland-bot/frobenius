version: "v0.4"

project:
  name: "Frobenius: Frobenius congruences for the Möbius function and the exact number of divisor levels"
  description: >-
    For a prime p and k >= 1, the least L for which the Möbius function is congruent modulo p^k
    to a sum of zeta^z * E_p(g_z) over the levels z <= L, with zeta^z the Dirichlet powers of
    zeta, E_p the Frobenius pushforward (E_p g)(j^p) = g(j) and integer valued g_z, is
    S(p^k) - 1, where S(p^k) is the Kempner value, the least N with p^k dividing N!. The same
    upper bound holds for the Dirichlet inverse of every f with f(1) a unit, over every
    commutative ring; over Z and Z_p it is exact as soon as there are n primes q with p not
    dividing f(q) and p^n >= S(p^k), with no multiplicativity assumed. In the power series rings
    Z[[x_1, ..., x_n]] and Z_p[[x_1, ..., x_n]] with the lift x_i -> x_i^p, and in the Dirichlet
    ring over Z and Z_p, the exact level count of every unit is given by a depth-flag formula of
    Legendre type. The development also proves Conjecture 4 of Kauers, Krattenthaler and Müller
    for every prime p: the least t-degree of a monic A in Z[z][t] with A(z, Phi_p(z)) congruent
    to 0 modulo p^gamma, where Phi_p(z) is the sum of z^(p^n), is S(p^gamma).
  authors:
    - "Joseph S. Farland"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Joseph S. Farland"

