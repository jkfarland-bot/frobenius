status:
  scope: >-
    Formalized: every theorem, proposition, lemma and corollary of the preprint, in the form
    stated there (see CLAIMS.md): the Frobenius congruence in the Dirichlet ring, the truncated
    expansion, the exact level count L(p,k) = S(p^k) - 1 for the Möbius function and an identity
    modulo 8 (namespace FrobCong); Conjecture 4 of Kauers, Krattenthaler and Müller for every
    prime (namespace Frobenius.KKM); the upper bound S(p^k) - 1 for every f with f(1) a unit over
    every commutative ring, the monic form and general upper bounds for every Frobenius lift, the
    depth-flag formula for every unit of Z[[x_1..x_n]] and Z_p[[x_1..x_n]] with the standard lift
    and for every f with f(1) a unit in the Dirichlet ring over Z and Z_p, its special cases, and
    the sharpness of S(p^k) - 1 over Z and Z_p from n primes with p not dividing f(q) and
    p^n >= S(p^k) (namespaces FrobLevel, FrobLevel.Dir). The repository also contains further
    formalized results on other Frobenius lifts (namespaces FrobLevel, L8v, L10) that the
    preprint does not use. Version 1.1.0 adds: the lower bound for coefficients in every
    Z/p^k-algebra with p^(k-1) nonzero, from finitely many rows, and from squarefree n alone; closed
    forms for S(p^k); the levels z = pi - 1 over every commutative ring; the lower bound over every
    commutative ring for multiplicative f; the failure of the polynomial of Krattenthaler and
    Mueller's Proposition 2 for the modulus p^(p+1) and its correction; the depth flag of
    multiplicative f over Z and Z_p; and the Mertens function modulo 8 through the squarefree
    count (namespaces FrobCong, FrobLevel.Dir, Frobenius.KKM). Not formalized: the results over
    Z[chi] (ramified or not), the Laurent completion, and the remaining results on other lifts;
    they are proved on paper in the larger paper. No conjecture is stated in the repository.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

